name: Automated Database Backup Pipeline

on:
  schedule:
    # Runs everyday at 02:00 UTC (Nightly maintenance window)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  backup-database:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Execute Automated Database Backup
      run: node scripts/backup-database.js
      env:
        VITE_SUPABASE_URL: "${{ secrets.VITE_SUPABASE_URL }}"
        VITE_SUPABASE_ANON_KEY: "${{ secrets.VITE_SUPABASE_ANON_KEY }}"
        SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
        SUPABASE_KEY: "${{ secrets.SUPABASE_KEY }}"

    - name: Upload Compressed Backup Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: db-backup-snapshot
        path: backups/
        retention-days: 14
