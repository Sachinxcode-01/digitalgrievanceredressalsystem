<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background-color: #F8FAFC;
      color: #1E293B;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #F8FAFC;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    }
    .content {
      padding: 32px 24px;
      color: #334155;
      font-size: 15px;
      line-height: 1.6;
    }
    .content p {
      margin-top: 0;
      margin-bottom: 20px;
    }
    .content strong {
      color: #0F172A;
    }
    .card {
      background-color: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 20px;
      margin: 24px 0;
    }
    .card-alert {
      border-left: 4px solid #DC2626 !important;
      background-color: #FEF2F2 !important;
      border-top: 1px solid #FEE2E2 !important;
      border-right: 1px solid #FEE2E2 !important;
      border-bottom: 1px solid #FEE2E2 !important;
    }
    .card-alert h3 {
      color: #991B1B !important;
      border-bottom-color: #FEE2E2 !important;
    }
    .card h3 {
      margin-top: 0;
      color: #0F172A;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 8px;
      font-weight: 700;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      color: #FFFFFF !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      box-sizing: border-box;
    }
    .btn-user {
      background-color: #2563EB;
    }
    .btn-admin {
      background-color: #1E293B;
    }
    .btn-resolved {
      background-color: #16A34A;
    }
    .btn-escalated {
      background-color: #DC2626;
    }
    .btn:hover {
      opacity: 0.95;
    }
    .btn-container-none {
      display: none !important;
    }
    .btn-container-block {
      display: block !important;
    }
    .btn-container-inline-block {
      display: inline-block !important;
    }
    .alert-container-none {
      display: none !important;
    }
    .alert-container-block {
      display: block !important;
    }
    .otp-code {
      font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #1E293B;
    }
    .warning-box {
      border-left: 4px solid #D97706;
      background-color: #FFFBEB;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 24px;
      border-top: 1px solid #FEF3C7;
      border-right: 1px solid #FEF3C7;
      border-bottom: 1px solid #FEF3C7;
    }
    .warning-box p {
      margin: 0;
      font-size: 13px;
      color: #B45309;
      line-height: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      body, .wrapper {
        background-color: #0F172A !important;
        color: #E2E8F0 !important;
      }
      .container {
        background-color: #1E293B !important;
        border-color: #334155 !important;
      }
      .content {
        color: #CBD5E1 !important;
      }
      .content strong {
        color: #FFFFFF !important;
      }
      .card {
        background-color: #0F172A !important;
        border-color: #334155 !important;
      }
      .card h3 {
        color: #FFFFFF !important;
        border-bottom-color: #334155 !important;
      }
      .card-alert {
        background-color: #451A03 !important;
        border-color: #7F1D1D !important;
      }
      .card-alert h3 {
        color: #F87171 !important;
        border-bottom-color: #7F1D1D !important;
      }
      .otp-code {
        color: #FFFFFF !important;
      }
      .warning-box {
        background-color: #451A03 !important;
        border-color: #78350F !important;
      }
      .warning-box p {
        color: #FBBF24 !important;
      }
    }
    @media only screen and (max-width: 600px) {
      .container {
        border-radius: 8px;
      }
      .content {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      {{header}}
      <div class="content">
        {{content}}
      </div>
      {{footer}}
    </div>
  </div>
</body>
</html>
