<p>Hello Officer,</p>
<p>A new grievance ticket has been assigned to your review queue.</p>
<div class="card">
  <h3>Assignment Parameters</h3>
  <p style="margin: 5px 0;"><strong>Ticket ID:</strong> #{{ticketId}}</p>
  <p style="margin: 5px 0;"><strong>Subject:</strong> {{title}}</p>
  <p style="margin: 5px 0;"><strong>Category Group:</strong> {{category}}</p>
  <p style="margin: 5px 0;"><strong>Urgency Rating:</strong> <span style="font-weight: bold; color: #f59e0b;">{{priority}}</span></p>
</div>
<a href="{{frontendUrl}}/admin/dashboard?tab=grievances" class="btn btn-admin">Open Command Panel</a>
