<p style="margin: 0 0 16px 0;">Hello Officer,</p>
<p style="margin: 0 0 24px 0;">A new grievance ticket has been assigned to your review queue.</p>

<div class="card" style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 20px; margin: 24px 0;">
  <h3 style="margin: 0 0 12px 0; color: #0F172A; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #E2E8F0; padding-bottom: 8px; font-weight: 700;">Assignment Parameters</h3>
  <p style="margin: 8px 0; font-size: 14px;"><strong>Ticket ID:</strong> <span style="font-family: monospace; font-weight: 700; color: #2563EB;">#{{ticketId}}</span></p>
  <p style="margin: 8px 0; font-size: 14px;"><strong>Subject:</strong> {{title}}</p>
  <p style="margin: 8px 0; font-size: 14px;"><strong>Category Group:</strong> {{category}}</p>
  <p style="margin: 8px 0; font-size: 14px;"><strong>Urgency Rating:</strong> <span style="font-weight: 600; color: #D97706;">{{priority}}</span></p>
</div>

<div style="text-align: center; margin: 28px 0;">
  <a href="{{frontendUrl}}/admin/dashboard?tab=grievances" class="btn btn-admin" style="background-color: #1E293B;">Open Command Panel</a>
</div>
