<p style="margin: 0 0 16px 0;">Hello,</p>
<p style="margin: 0 0 20px 0;">{{message}}</p>

<div style="text-align: center; margin: 24px 0; display: {{displayBtn}};">
  <a href="{{actionUrl}}" class="btn btn-user" style="display: inline-block; padding: 12px 24px; color: #FFFFFF; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; background-color: #2563EB;">{{btnText}}</a>
</div>

<div class="card card-alert" style="margin: 24px 0; display: {{displayAlert}};">
  <h3 style="margin-top: 0; color: #DC2626; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #FCA5A5; padding-bottom: 8px; font-weight: 700;">Security Notice</h3>
  <p style="margin: 0; font-size: 14px;">{{alertMessage}}</p>
</div>

<p style="margin: 0; font-size: 14px; color: #64748B;">{{infoText}}</p>
