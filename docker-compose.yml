version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolvenow-app
    ports:
      - "5000:5000"
    environment:

      - PORT=5000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL:-${VITE_SUPABASE_URL}}
      - SUPABASE_KEY=${SUPABASE_KEY:-${VITE_SUPABASE_ANON_KEY}}
      - JWT_SECRET=${JWT_SECRET:-resolvenow-enterprise-secret-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMS_GATEWAY_URL=${SMS_GATEWAY_URL:-http://10.105.47.157:8080/api/v1}
      - SMS_GATEWAY_LOGIN=${SMS_GATEWAY_LOGIN:-sms}
      - SMS_GATEWAY_PASSWORD=${SMS_GATEWAY_PASSWORD:-FeemKLig}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/health/liveness', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
