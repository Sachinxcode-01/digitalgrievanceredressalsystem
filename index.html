<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo_192.png" />
    <link rel="apple-touch-icon" href="/logo_192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport (zoom enabled for accessibility) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme color adapts to light / dark -->
    <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />

    <!-- Primary meta -->
    <title>ResolveNow — AI-Powered Digital Grievance Redressal System</title>
    <meta name="description" content="ResolveNow is a secure, AI-powered digital grievance redressal platform for colleges, universities, and offices. Submit complaints, track status in real time, and get faster, transparent resolutions with Gemini AI triage." />
    <meta name="keywords" content="digital grievance system, grievance redressal, complaint management, AI grievance portal, SLA tracking, college complaint system, institution grievance, ResolveNow" />
    <meta name="author" content="ResolveNow" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://resolvenow.gov.in/" />

    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ResolveNow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResolveNow" />
    <meta property="og:url" content="https://resolvenow.gov.in/" />
    <meta property="og:title" content="ResolveNow — AI-Powered Digital Grievance Redressal System" />
    <meta property="og:description" content="Secure, AI-powered grievance redressal. Submit, track, and resolve complaints with Gemini AI triage, SLA timers, and full transparency." />
    <meta property="og:image" content="https://resolvenow.gov.in/banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ResolveNowIN" />
    <meta name="twitter:title" content="ResolveNow — AI-Powered Digital Grievance Redressal System" />
    <meta name="twitter:description" content="Secure, AI-powered grievance redressal. Submit, track, and resolve complaints with transparency and accountability." />
    <meta name="twitter:image" content="https://resolvenow.gov.in/banner.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ResolveNow",
      "url": "https://resolvenow.gov.in/",
      "description": "AI-powered digital grievance redressal system for colleges, universities, corporate offices, and public institutions. Features Gemini AI triage, SLA tracking, public ticket tracking, and role-based dashboards.",
      "applicationCategory": "GovernmentApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "author": {
        "@type": "Organization",
        "name": "ResolveNow",
        "url": "https://resolvenow.gov.in/"
      },
      "featureList": [
        "AI Grievance Triage with Gemini",
        "Real-time public ticket tracking",
        "SLA deadline enforcement",
        "Role-based access control",
        "Email notifications",
        "Admin analytics dashboard",
        "Audit logs",
        "File attachments"
      ],
      "screenshot": "https://resolvenow.gov.in/banner.png",
      "logo": "https://resolvenow.gov.in/logo_192.png"
    }
    </script>

    <!-- Font preconnect for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Note: Google Fonts stylesheet is loaded via src/styles/index.css @import -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
