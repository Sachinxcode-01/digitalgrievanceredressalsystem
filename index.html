<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo_192.png" />
    <link rel="apple-touch-icon" href="/logo_192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport (zoom enabled for accessibility) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme color adapts to light / dark -->
    <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />

    <!-- Primary meta -->
    <title>ResolveNow — Digital Grievance Redressal System</title>
    <meta name="description" content="ResolveNow is a secure, AI-powered digital grievance redressal platform. Submit complaints, track status in real time, and get faster, transparent resolutions." />
    <meta name="author" content="ResolveNow" />

    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ResolveNow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResolveNow" />
    <meta property="og:title" content="ResolveNow — Digital Grievance Redressal System" />
    <meta property="og:description" content="Secure, AI-powered grievance redressal. Submit, track, and resolve complaints with transparency and accountability." />
    <meta property="og:image" content="/banner.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ResolveNow — Digital Grievance Redressal System" />
    <meta name="twitter:description" content="Secure, AI-powered grievance redressal. Submit, track, and resolve complaints with transparency and accountability." />
    <meta name="twitter:image" content="/banner.png" />

    <!-- Font preconnect for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
