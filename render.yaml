# yaml-language-server: $schema=./.vscode/render.schema.json
services:
  - type: web
    name: digital-grievance-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ALLOWED_ORIGINS
        value: https://digitalgrievanceredressalsystem.onrender.com
